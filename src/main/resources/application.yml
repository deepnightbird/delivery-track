spring:
  application:
    name: &applicationName DeliveryTracking
  config:
    import: optional:configserver:http://localhost:8600
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: *applicationName
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.colvir.dto, org.springframework.cloud.bus.event"
  #      auto-offset-reset: latest # by default, earliest
  main:
    banner-mode: 'off'
  jpa:
    show-sql: true
    hibernate:
      naming:
        physical-strategy:
          org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      format_sql: true
  #  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery
    username: delivery_user
    password: delivery_password
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: 'classpath:db/changelog/changeLog.xml'
#    default-schema: 'deliverydb'
#    liquibase-schema: 'deliverydb'

# JWT
jwt:
  secret: "2D4A614E645267556B58703273357638792F423F4428472B4B6250655368566D"
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
#    prometheus:
#      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG